name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

# Build and deploy are separate jobs (2026-11-24):
# - Re-running a failed single job uploaded a second "github-pages" artifact and deploy-pages then
#   failed with "Multiple artifacts named github-pages" (actions/deploy-pages#338). With a separate
#   deploy job, "Re-run failed jobs" re-runs only the deploy and reuses the one artifact.
# - First attempts also failed with "No artifacts named github-pages" right after a successful upload
#   (cause unconfirmed; looks like artifact listing lagging the upload). The job boundary may help; unverified.
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Type check
        run: npm run lint

      - name: Unit tests
        # AgentRunner tests the Windows-only agent harness (tools/agent/run.mjs: PowerShell/taskkill);
        # StatusResume drives a local msedge through Playwright, which the Linux runner does not have.
        # Both still run in the local npm test.
        run: npx vitest run --exclude "**/AgentRunner.test.ts" --exclude "**/StatusResume.test.ts"

      - name: Build
        run: npm run build

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
