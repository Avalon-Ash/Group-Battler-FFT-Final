<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>WebGL post-processing prototype</title>
<style>
  :root { color-scheme: dark; }
  body { margin: 0; background: #0b0d12; color: #cfd6e4; font: 12px/1.35 system-ui, sans-serif; display: flex; height: 100vh; }
  #side { width: 330px; flex: none; overflow-y: auto; padding: 10px 12px; border-right: 1px solid #222a38; box-sizing: border-box; }
  #view { flex: 1; min-width: 0; position: relative; overflow: hidden; }
  canvas#out { position: absolute; left: 0; top: 0; width: 100%; height: 100%; object-fit: contain; cursor: crosshair; }
  h2 { font-size: 12px; margin: 14px 0 6px; color: #8fb4ff; text-transform: uppercase; letter-spacing: .06em; }
  .row { display: grid; grid-template-columns: 92px 1fr 44px; gap: 6px; align-items: center; margin: 2px 0; }
  .row input[type=range] { width: 100%; }
  .row span.v { text-align: right; color: #8b95a8; font-variant-numeric: tabular-nums; }
  button, select { background: #1a2130; color: inherit; border: 1px solid #2c374b; border-radius: 4px; padding: 3px 8px; font: inherit; }
  button:hover { border-color: #5b7fc7; }
  #stats { font-family: ui-monospace, Consolas, monospace; white-space: pre; background: #10151f; padding: 6px 8px; border-radius: 4px; }
  #bench { font-family: ui-monospace, Consolas, monospace; white-space: pre-wrap; background: #10151f; padding: 6px 8px; border-radius: 4px; margin-top: 6px; }
  .light { border: 1px solid #222a38; border-radius: 4px; padding: 4px 6px; margin: 4px 0; }
  .light .row { grid-template-columns: 60px 1fr 44px; }
  label.chk { display: flex; align-items: center; gap: 6px; margin: 3px 0; }
  .hint { color: #7c869a; }
</style>
</head>
<body>
<div id="side">
  <div><b>WebGL post prototype</b> <span class="hint">(standalone, no engine changes)</span></div>
  <div class="hint">Canvas 2D frame &rarr; texImage2D each frame &rarr; WebGL post &rarr; screen. Drag on the image to move the selected light.</div>

  <h2>Source</h2>
  <div class="row" style="grid-template-columns:92px 1fr"><span>Image</span>
    <input id="file" type="file" accept="image/png,image/jpeg"></div>
  <div class="row" style="grid-template-columns:92px 1fr"><span>Canvas size</span>
    <select id="size"><option value="2560x1440" selected>2560 x 1440</option><option value="1920x1080">1920 x 1080</option><option value="1280x720">1280 x 720</option></select></div>
  <label class="chk"><input id="reupload" type="checkbox" checked> upload source texture every frame</label>
  <label class="chk"><input id="animate" type="checkbox"> animate source (moving sprite, forces 2D redraw)</label>

  <h2>Bloom</h2>
  <div class="row" style="grid-template-columns:92px 1fr"><span>Method</span>
    <select id="bloomMode"><option value="kawase" selected>dual kawase</option><option value="gauss">2-pass gaussian</option><option value="off">off</option></select></div>
  <div id="bloomCtl"></div>

  <h2>Color grade</h2><div id="gradeCtl"></div>
  <h2>Vignette</h2><div id="vigCtl"></div>

  <h2>Point lights (additive ground relight)</h2>
  <div class="row" style="grid-template-columns:1fr 1fr 1fr"><button id="addLight">add light</button><button id="delLight">remove last</button><label class="chk"><input id="lightsOn" type="checkbox" checked>on</label></div>
  <div id="lightCtl"></div>
  <div id="lightList"></div>

  <h2>Cost</h2>
  <div id="stats">warming up...</div>
  <div class="row" style="grid-template-columns:1fr 1fr"><button id="benchBtn">run bench (120 frames, readPixels-synced)</button><label class="chk"><input id="passthru" type="checkbox"> passthrough only</label></div>
  <div id="bench"></div>
</div>
<div id="view"><canvas id="out"></canvas></div>

<script>
'use strict';
const $ = (id) => document.getElementById(id);
const DEFAULT_IMG = 'ui-e2e/baseline/fidelity/battle_frozen.png';
const MAX_LIGHTS = 8;

// ------------------------------------------------------------------ params + UI
const P = {
  bloom: { threshold: 0.62, knee: 0.35, intensity: 0.9, levels: 4, radius: 1.0 },
  grade: { lift: 0.0, gamma: 1.0, gain: 1.0, sat: 1.05, exposure: 0.0 },
  vig:   { strength: 0.35, radius: 0.85, softness: 0.55 },
  light: { ellipse: 2.0, multiply: 2.2, add: 0.10 },
  lights: [
    { x: 0.38, y: 0.55, r: 0.16, i: 1.4, c: '#ffb347' },
    { x: 0.60, y: 0.48, r: 0.12, i: 1.2, c: '#55b4ff' },
    { x: 0.50, y: 0.70, r: 0.20, i: 0.9, c: '#c070ff' },
  ],
  sel: 0,
};
function slider(host, group, key, label, min, max, step) {
  const row = document.createElement('div'); row.className = 'row';
  const l = document.createElement('span'); l.textContent = label;
  const inp = document.createElement('input'); inp.type = 'range'; inp.min = min; inp.max = max; inp.step = step; inp.value = group[key];
  const v = document.createElement('span'); v.className = 'v'; v.textContent = (+group[key]).toFixed(2);
  inp.oninput = () => { group[key] = parseFloat(inp.value); v.textContent = (+group[key]).toFixed(2); };
  row.append(l, inp, v); host.append(row);
}
[['threshold',0,1.5,0.01],['knee',0,1,0.01],['intensity',0,3,0.01],['levels',1,6,1],['radius',0.3,3,0.05]].forEach(([k,mn,mx,st]) => slider($('bloomCtl'), P.bloom, k, k, mn, mx, st));
[['exposure',-2,2,0.01],['lift',-0.2,0.3,0.005],['gamma',0.4,2.5,0.01],['gain',0.3,2.5,0.01],['sat',0,2.5,0.01]].forEach(([k,mn,mx,st]) => slider($('gradeCtl'), P.grade, k, k, mn, mx, st));
[['strength',0,1,0.01],['radius',0.2,1.4,0.01],['softness',0.05,1.2,0.01]].forEach(([k,mn,mx,st]) => slider($('vigCtl'), P.vig, k, k, mn, mx, st));
[['ellipse',1,4,0.05],['multiply',0,4,0.05],['add',0,0.4,0.005]].forEach(([k,mn,mx,st]) => slider($('lightCtl'), P.light, k, k === 'ellipse' ? 'iso squash' : k, mn, mx, st));

function rebuildLightUI() {
  const host = $('lightList'); host.innerHTML = '';
  P.lights.forEach((L, idx) => {
    const box = document.createElement('div'); box.className = 'light'; box.style.borderColor = idx === P.sel ? '#5b7fc7' : '';
    const head = document.createElement('div'); head.style.cssText = 'display:flex;gap:8px;align-items:center';
    const pick = document.createElement('button'); pick.textContent = 'light ' + (idx + 1); pick.onclick = () => { P.sel = idx; rebuildLightUI(); };
    const col = document.createElement('input'); col.type = 'color'; col.value = L.c; col.oninput = () => { L.c = col.value; };
    head.append(pick, col); box.append(head);
    [['x',0,1,0.005],['y',0,1,0.005],['r',0.02,0.6,0.005],['i',0,4,0.05]].forEach(([k,mn,mx,st]) => slider(box, L, k, k === 'r' ? 'radius' : k === 'i' ? 'intensity' : k, mn, mx, st));
    host.append(box);
  });
}
rebuildLightUI();
$('addLight').onclick = () => { if (P.lights.length < MAX_LIGHTS) { P.lights.push({ x: 0.5, y: 0.5, r: 0.14, i: 1.2, c: '#ffffff' }); P.sel = P.lights.length - 1; rebuildLightUI(); } };
$('delLight').onclick = () => { P.lights.pop(); P.sel = Math.min(P.sel, P.lights.length - 1); rebuildLightUI(); };

// ------------------------------------------------------------------ source canvas (stands in for the Canvas 2D game frame)
const src = document.createElement('canvas');
const sctx = src.getContext('2d');
let img = null, W = 2560, H = 1440;
function setSize() {
  const [w, h] = $('size').value.split('x').map(Number); W = w; H = h;
  src.width = W; src.height = H; out.width = W; out.height = H;
  allocTargets(); drawSource(0);
}
function drawSource(t) {
  sctx.fillStyle = '#05060a'; sctx.fillRect(0, 0, W, H);
  if (img) {
    const s = Math.min(W / img.width, H / img.height), dw = img.width * s, dh = img.height * s;
    sctx.imageSmoothingEnabled = true; sctx.imageSmoothingQuality = 'high';
    sctx.drawImage(img, (W - dw) / 2, (H - dh) / 2, dw, dh);
  }
  if ($('animate').checked) {
    const x = W * (0.5 + 0.3 * Math.sin(t / 700)), y = H * (0.5 + 0.2 * Math.cos(t / 900));
    const g = sctx.createRadialGradient(x, y, 0, x, y, 90);
    g.addColorStop(0, 'rgba(255,240,200,1)'); g.addColorStop(1, 'rgba(255,160,40,0)');
    sctx.globalCompositeOperation = 'lighter'; sctx.fillStyle = g; sctx.fillRect(x - 90, y - 90, 180, 180); sctx.globalCompositeOperation = 'source-over';
  }
  srcDirty = true;
}
let srcDirty = true;
function loadImage(url) {
  return new Promise((res) => { const i = new Image(); i.onload = () => { img = i; res(true); }; i.onerror = () => res(false); i.src = url; });
}
$('file').onchange = async (e) => { const f = e.target.files[0]; if (!f) return; await loadImage(URL.createObjectURL(f)); drawSource(0); };
$('size').onchange = setSize; $('animate').onchange = () => drawSource(0);

// ------------------------------------------------------------------ GL
const out = $('out');
const gl = out.getContext('webgl2', { antialias: false, alpha: false, premultipliedAlpha: false, preserveDrawingBuffer: false, powerPreference: 'high-performance' });
if (!gl) { document.body.innerHTML = '<p style="padding:20px">WebGL2 not available.</p>'; throw new Error('no webgl2'); }
const timerExt = gl.getExtension('EXT_disjoint_timer_query_webgl2');
const dbg = gl.getExtension('WEBGL_debug_renderer_info');
const rendererName = dbg ? gl.getParameter(dbg.UNMASKED_RENDERER_WEBGL) : 'unknown';

const VS = `#version 300 es
out vec2 vUv;
void main(){ vec2 p = vec2((gl_VertexID<<1)&2, gl_VertexID&2); vUv = p; gl_Position = vec4(p*2.-1., 0., 1.); }`;
const FS_HEAD = `#version 300 es
precision highp float; in vec2 vUv; out vec4 o; uniform sampler2D uTex; uniform vec2 uTexel;`;
const SH = {
  copy: FS_HEAD + `void main(){ o = texture(uTex, vUv); }`,
  bright: FS_HEAD + `uniform float uThr, uKnee;
    void main(){ vec3 c = texture(uTex, vUv).rgb; float br = max(max(c.r,c.g),c.b);
      float s = clamp(br - uThr + uKnee, 0., 2.*uKnee); s = s*s/(4.*uKnee + 1e-4);
      float w = max(s, br - uThr)/max(br, 1e-4); o = vec4(c*w, 1.); }`,
  down: FS_HEAD + `uniform float uOff; void main(){ vec2 h = uTexel*uOff; vec4 s = texture(uTex,vUv)*4.;
      s += texture(uTex,vUv-h)+texture(uTex,vUv+h)+texture(uTex,vUv+vec2(h.x,-h.y))+texture(uTex,vUv-vec2(h.x,-h.y)); o = s/8.; }`,
  up: FS_HEAD + `uniform float uOff; void main(){ vec2 h = uTexel*0.5*uOff; vec4 s = vec4(0);
      s += texture(uTex,vUv+vec2(-h.x*2.,0)); s += texture(uTex,vUv+vec2(-h.x,h.y))*2.; s += texture(uTex,vUv+vec2(0,h.y*2.));
      s += texture(uTex,vUv+vec2(h.x,h.y))*2.; s += texture(uTex,vUv+vec2(h.x*2.,0)); s += texture(uTex,vUv+vec2(h.x,-h.y))*2.;
      s += texture(uTex,vUv+vec2(0,-h.y*2.)); s += texture(uTex,vUv+vec2(-h.x,-h.y))*2.; o = s/12.; }`,
  gauss: FS_HEAD + `uniform vec2 uDir; // linear-sampled 9-tap (5 fetches)
    void main(){ vec2 d = uDir*uTexel; vec4 s = texture(uTex,vUv)*0.2270270270;
      s += texture(uTex,vUv+d*1.3846153846)*0.3162162162 + texture(uTex,vUv-d*1.3846153846)*0.3162162162;
      s += texture(uTex,vUv+d*3.2307692308)*0.0702702703 + texture(uTex,vUv-d*3.2307692308)*0.0702702703; o = s; }`,
  comp: FS_HEAD + `uniform sampler2D uBloom; uniform float uBloomI, uExposure, uLift, uGamma, uGain, uSat;
    uniform float uVigS, uVigR, uVigSoft; uniform vec2 uRes; uniform int uLightN; uniform float uLightOn;
    uniform vec2 uLP[8]; uniform vec3 uLC[8]; uniform float uLR[8]; uniform float uEll, uMul, uAdd;
    void main(){
      vec3 c = texture(uTex, vUv).rgb; vec3 base = c;
      vec2 px = vUv*uRes;
      if(uLightOn > 0.5){ vec3 L = vec3(0.);
        for(int i=0;i<8;i++){ if(i>=uLightN) break;
          vec2 d = (px - uLP[i]); d.y *= uEll; float f = clamp(1. - length(d)/uLR[i], 0., 1.); f = f*f*(3.-2.*f); f *= f;
          L += uLC[i]*f; }
        c += (base*uMul + uAdd)*L; }
      c += texture(uBloom, vUv).rgb*uBloomI;
      c *= exp2(uExposure);
      c = c*uGain + uLift; c = pow(max(c, 0.), vec3(1./uGamma));
      float l = dot(c, vec3(0.2126,0.7152,0.0722)); c = mix(vec3(l), c, uSat);
      vec2 q = vUv - .5; q.x *= uRes.x/uRes.y; float v = smoothstep(uVigR, uVigR - uVigSoft, length(q)); c *= mix(1., v, uVigS);
      o = vec4(c, 1.); }`,
};
function compile(type, code) { const s = gl.createShader(type); gl.shaderSource(s, code); gl.compileShader(s); if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(s)); return s; }
const vs = compile(gl.VERTEX_SHADER, VS);
const prog = {};
for (const k in SH) {
  const p = gl.createProgram(); gl.attachShader(p, vs); gl.attachShader(p, compile(gl.FRAGMENT_SHADER, SH[k])); gl.linkProgram(p);
  if (!gl.getProgramParameter(p, gl.LINK_STATUS)) throw new Error(k + ': ' + gl.getProgramInfoLog(p));
  p.u = {}; const n = gl.getProgramParameter(p, gl.ACTIVE_UNIFORMS);
  for (let i = 0; i < n; i++) { const nm = gl.getActiveUniform(p, i).name.replace('[0]', ''); p.u[nm] = gl.getUniformLocation(p, nm); }
  prog[k] = p;
}
const vao = gl.createVertexArray(); gl.bindVertexArray(vao);

function makeTarget(w, h) {
  const t = gl.createTexture(); gl.bindTexture(gl.TEXTURE_2D, t);
  gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA8, w, h, 0, gl.RGBA, gl.UNSIGNED_BYTE, null);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR); gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE); gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
  const f = gl.createFramebuffer(); gl.bindFramebuffer(gl.FRAMEBUFFER, f); gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, t, 0);
  return { t, f, w, h };
}
const srcTex = gl.createTexture();
gl.bindTexture(gl.TEXTURE_2D, srcTex);
gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR); gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE); gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL, true);

let chain = [], pingA, pingB;
function allocTargets() {
  chain = []; let w = Math.max(1, W >> 1), h = Math.max(1, H >> 1);
  for (let i = 0; i < 7; i++) { chain.push(makeTarget(w, h)); w = Math.max(1, w >> 1); h = Math.max(1, h >> 1); }
  pingA = makeTarget(W >> 1, H >> 1); pingB = makeTarget(W >> 1, H >> 1);
  srcAllocated = false;
}
let srcAllocated = false;

function bindTex(t, unit = 0) { gl.activeTexture(gl.TEXTURE0 + unit); gl.bindTexture(gl.TEXTURE_2D, t); }
function pass(name, inTex, target, setU) {
  const p = prog[name]; gl.useProgram(p);
  gl.bindFramebuffer(gl.FRAMEBUFFER, target ? target.f : null);
  gl.viewport(0, 0, target ? target.w : W, target ? target.h : H);
  bindTex(inTex, 0); gl.uniform1i(p.u.uTex, 0);
  if (setU) setU(p);
  gl.drawArrays(gl.TRIANGLES, 0, 3);
}
const texelSet = (w, h) => (p) => gl.uniform2f(p.u.uTexel, 1 / w, 1 / h);
function hexToRgb(hex) { const n = parseInt(hex.slice(1), 16); return [(n >> 16 & 255) / 255, (n >> 8 & 255) / 255, (n & 255) / 255]; }

function upload() {
  bindTex(srcTex, 0);
  if (!srcAllocated) { gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA8, gl.RGBA, gl.UNSIGNED_BYTE, src); srcAllocated = true; }
  else gl.texSubImage2D(gl.TEXTURE_2D, 0, 0, 0, gl.RGBA, gl.UNSIGNED_BYTE, src);
}
function runPasses(passthrough) {
  if (passthrough) { pass('copy', srcTex, null); return; }
  const mode = $('bloomMode').value; let bloomTex = chain[0].t; const half = chain[0];
  if (mode !== 'off') {
    pass('bright', srcTex, half, (p) => { texelSet(W, H)(p); gl.uniform1f(p.u.uThr, P.bloom.threshold); gl.uniform1f(p.u.uKnee, P.bloom.knee); });
    if (mode === 'kawase') {
      const n = Math.min(P.bloom.levels, 6);
      for (let i = 0; i < n; i++) pass('down', chain[i].t, chain[i + 1], (p) => { texelSet(chain[i].w, chain[i].h)(p); gl.uniform1f(p.u.uOff, P.bloom.radius); });
      for (let i = n; i > 0; i--) pass('up', chain[i].t, chain[i - 1], (p) => { texelSet(chain[i].w, chain[i].h)(p); gl.uniform1f(p.u.uOff, P.bloom.radius); });
      bloomTex = chain[0].t;
    } else {
      // 2-pass gaussian at half res; "levels" scales the footprint by stepping offsets, radius widens it
      const s = P.bloom.radius * Math.max(1, P.bloom.levels);
      pass('gauss', half.t, pingA, (p) => { texelSet(pingA.w, pingA.h)(p); gl.uniform2f(p.u.uDir, s, 0); });
      pass('gauss', pingA.t, pingB, (p) => { texelSet(pingB.w, pingB.h)(p); gl.uniform2f(p.u.uDir, 0, s); });
      bloomTex = pingB.t;
    }
  }
  const lights = P.lights.slice(0, MAX_LIGHTS);
  pass('comp', srcTex, null, (p) => {
    bindTex(bloomTex, 1); gl.uniform1i(p.u.uBloom, 1);
    gl.uniform1f(p.u.uBloomI, mode === 'off' ? 0 : P.bloom.intensity);
    gl.uniform1f(p.u.uExposure, P.grade.exposure); gl.uniform1f(p.u.uLift, P.grade.lift); gl.uniform1f(p.u.uGamma, P.grade.gamma);
    gl.uniform1f(p.u.uGain, P.grade.gain); gl.uniform1f(p.u.uSat, P.grade.sat);
    gl.uniform1f(p.u.uVigS, P.vig.strength); gl.uniform1f(p.u.uVigR, P.vig.radius); gl.uniform1f(p.u.uVigSoft, P.vig.softness);
    gl.uniform2f(p.u.uRes, W, H); gl.uniform1i(p.u.uLightN, lights.length); gl.uniform1f(p.u.uLightOn, $('lightsOn').checked ? 1 : 0);
    gl.uniform1f(p.u.uEll, P.light.ellipse); gl.uniform1f(p.u.uMul, P.light.multiply); gl.uniform1f(p.u.uAdd, P.light.add);
    const lp = new Float32Array(16), lc = new Float32Array(24), lr = new Float32Array(8);
    lights.forEach((L, i) => { lp[i*2] = L.x * W; lp[i*2+1] = (1 - L.y) * H; const c = hexToRgb(L.c); lc.set(c.map((v) => v * L.i), i * 3); lr[i] = L.r * W; });
    gl.uniform2fv(p.u.uLP, lp); gl.uniform3fv(p.u.uLC, lc); gl.uniform1fv(p.u.uLR, lr);
  });
}

// ------------------------------------------------------------------ light dragging (canvas coordinates)
let dragging = false;
function moveSel(e) {
  const r = out.getBoundingClientRect(); const s = Math.min(r.width / W, r.height / H);
  const ox = (r.width - W * s) / 2, oy = (r.height - H * s) / 2;
  const L = P.lights[P.sel]; if (!L) return;
  L.x = Math.min(1, Math.max(0, (e.clientX - r.left - ox) / (W * s))); L.y = Math.min(1, Math.max(0, 1 - (e.clientY - r.top - oy) / (H * s)));
  rebuildLightUI();
}
out.onpointerdown = (e) => { dragging = true; out.setPointerCapture(e.pointerId); moveSel(e); };
out.onpointermove = (e) => { if (dragging) moveSel(e); };
out.onpointerup = () => { dragging = false; };

// ------------------------------------------------------------------ stats / timing
const frameTimes = []; let lastT = 0, uploadMs = 0, cpuPassMs = 0, gpuMs = null; const pending = [];
function collectQueries() {
  if (!timerExt) return;
  const disjoint = gl.getParameter(timerExt.GPU_DISJOINT_EXT);
  while (pending.length) {
    const q = pending[0];
    if (!gl.getQueryParameter(q, gl.QUERY_RESULT_AVAILABLE)) break;
    pending.shift();
    if (!disjoint) { const ns = gl.getQueryParameter(q, gl.QUERY_RESULT); gpuMs = gpuMs === null ? ns / 1e6 : gpuMs * 0.9 + (ns / 1e6) * 0.1; }
    gl.deleteQuery(q);
  }
}
function frame(t) {
  requestAnimationFrame(frame);
  if (lastT) { frameTimes.push(t - lastT); if (frameTimes.length > 120) frameTimes.shift(); }
  lastT = t;
  if ($('animate').checked) drawSource(t);
  const pt = $('passthru').checked;
  let t0 = performance.now();
  if ($('reupload').checked || srcDirty || !srcAllocated) { upload(); srcDirty = false; }
  const t1 = performance.now(); uploadMs = uploadMs * 0.9 + (t1 - t0) * 0.1;
  let q = null;
  if (timerExt && pending.length < 6) { q = gl.createQuery(); gl.beginQuery(timerExt.TIME_ELAPSED_EXT, q); }
  runPasses(pt);
  if (q) { gl.endQuery(timerExt.TIME_ELAPSED_EXT); pending.push(q); }
  cpuPassMs = cpuPassMs * 0.9 + (performance.now() - t1) * 0.1;
  collectQueries();
}
setInterval(() => {
  if (!frameTimes.length) return;
  const a = frameTimes.reduce((x, y) => x + y, 0) / frameTimes.length, mx = Math.max(...frameTimes);
  $('stats').textContent =
    `canvas        ${W}x${H}\nGPU           ${rendererName}\nrAF delta     avg ${a.toFixed(2)} ms (${(1000 / a).toFixed(0)} fps), max ${mx.toFixed(2)} ms\n` +
    `upload (CPU)  ${uploadMs.toFixed(2)} ms/frame   (call time only, async)\npasses (CPU)  ${cpuPassMs.toFixed(2)} ms/frame   (submit time only)\n` +
    `GPU time      ${timerExt ? (gpuMs === null ? 'waiting...' : gpuMs.toFixed(2) + ' ms (EXT_disjoint_timer_query, passes only)') : 'EXT_disjoint_timer_query_webgl2 unavailable'}\n` +
    `For synced upload / pass costs use "run bench".`;
}, 400);

// Synced bench: gl.finish() is a near no-op in Chrome/ANGLE, so each stage is followed by a 1-pixel
// readPixels, which blocks until all queued GPU work has completed. The upload stage ends with a 1x1 draw that
// samples the source texture so a lazily-performed upload is really forced inside that stage.
const syncPx = new Uint8Array(4);
function sync() { gl.bindFramebuffer(gl.FRAMEBUFFER, null); gl.readPixels(0, 0, 1, 1, gl.RGBA, gl.UNSIGNED_BYTE, syncPx); }
function touchSrc() {
  const p = prog.copy; gl.useProgram(p); gl.bindFramebuffer(gl.FRAMEBUFFER, null); gl.viewport(0, 0, 1, 1);
  bindTex(srcTex, 0); gl.uniform1i(p.u.uTex, 0); gl.drawArrays(gl.TRIANGLES, 0, 3);
}
async function bench(n = 120) {
  const rows = { upload: [], passes: [], total: [] };
  for (let i = -20; i < n; i++) {
    if ($('animate').checked) drawSource(i * 16.7);
    sync(); const a = performance.now();
    upload(); touchSrc(); sync(); const b = performance.now();
    runPasses($('passthru').checked); sync(); const c = performance.now();
    if (i >= 0) { rows.upload.push(b - a); rows.passes.push(c - b); rows.total.push(c - a); }
    if (i % 10 === 0) await new Promise((r) => setTimeout(r, 0));
  }
  const st = (v) => { const s = [...v].sort((x, y) => x - y); return { mean: +(v.reduce((x, y) => x + y, 0) / v.length).toFixed(3), p50: +s[Math.floor(s.length * .5)].toFixed(3), p95: +s[Math.floor(s.length * .95)].toFixed(3), max: +s[s.length - 1].toFixed(3) }; };
  const res = { gpu: rendererName, canvas: `${W}x${H}`, bloom: $('bloomMode').value, levels: P.bloom.levels, lights: $('lightsOn').checked ? P.lights.length : 0,
    passthrough: $('passthru').checked, reupload: true, frames: n, upload_ms: st(rows.upload), passes_ms: st(rows.passes), total_ms: st(rows.total) };
  $('bench').textContent = JSON.stringify(res, null, 1); window.__BENCH__ = res; return res;
}
$('benchBtn').onclick = () => bench(120);
window.__bench = bench; window.__P = P;
window.__ready = false;

// ------------------------------------------------------------------ boot
(async () => {
  const ok = await loadImage(DEFAULT_IMG);
  if (!ok) $('stats').textContent = 'Could not load ' + DEFAULT_IMG + ' (open via the dev server, or pick an image).';
  setSize();
  window.__ready = true;
  requestAnimationFrame(frame);
})();
</script>
