<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>TACTICAL.OS — Baked Terrain Height-Banded Prototype</title>
  <style>
    body {
      margin: 0;
      background: #0f172a;
      color: #e2e8f0;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow: hidden;
    }
    #hud {
      position: absolute;
      top: 16px;
      left: 16px;
      background: rgba(15, 23, 42, 0.85);
      border: 1px solid rgba(56, 189, 248, 0.3);
      padding: 12px 20px;
      border-radius: 8px;
      font-size: 13px;
      line-height: 1.6;
      box-shadow: 0 4px 20px rgba(0,0,0,0.5);
      pointer-events: auto;
      z-index: 10;
    }
    .badge {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 4px;
      font-weight: bold;
      background: #0284c7;
      color: #fff;
    }
    canvas {
      border: 1px solid #334155;
      background: #090d16;
      box-shadow: 0 10px 40px rgba(0,0,0,0.8);
    }
    .btn-group {
      margin-top: 8px;
      display: flex;
      gap: 8px;
    }
    button {
      background: #1e293b;
      color: #38bdf8;
      border: 1px solid #38bdf8;
      padding: 6px 14px;
      border-radius: 6px;
      cursor: pointer;
      font-family: inherit;
      font-size: 12px;
      font-weight: bold;
    }
    button:hover {
      background: #38bdf8;
      color: #0f172a;
    }
    button.active {
      background: #38bdf8;
      color: #0f172a;
    }
  </style>
</head>
<body>
  <div id="hud">
    <div><strong>TACTICAL.OS — Height-Banded Baked Terrain Prototype</strong></div>
    <div>Current Mode: <span id="modeLabel" class="badge">Per-Hex Blit (Baseline)</span></div>
    <div>Avg Frame Time: <strong id="msVal">0.00</strong> ms | FPS: <strong id="fpsVal">0</strong></div>
    <div>DrawCalls: <span id="dcVal">0</span> | Save/Restore: <span id="srVal">0</span></div>
    <div class="btn-group">
      <button id="btnPerHex" class="active" onclick="setMode('PER_HEX')">1. Per-Hex Blit (Baseline)</button>
      <button id="btnBaked" onclick="setMode('BAKED_2LAYER')">2. 2-Layer Height-Banded Baked</button>
      <button id="btnBenchmark" onclick="runBenchmark()">Run Automated Benchmark (300 frames)</button>
    </div>
    <div id="benchResult" style="margin-top: 8px; color: #4ade80;"></div>
  </div>

  <canvas id="viewCanvas" width="1440" height="900"></canvas>

  <script>
    const canvas = document.getElementById('viewCanvas');
    const ctx = canvas.getContext('2d');

    const W = canvas.width;
    const H = canvas.height;
    const HEX_RADIUS = 36;
    const SQRT3 = Math.sqrt(3);

    // 1. Generate Hexagonal Map Grid (~150 hexes, representing battlefield)
    const mapHexes = [];
    const MAP_RADIUS = 7;
    for (let q = -MAP_RADIUS; q <= MAP_RADIUS; q++) {
      const r1 = Math.max(-MAP_RADIUS, -q - MAP_RADIUS);
      const r2 = Math.min(MAP_RADIUS, -q + MAP_RADIUS);
      for (let r = r1; r <= r2; r++) {
        // Pixel coordinates in 2.5D Isometric
        const px = W / 2 + HEX_RADIUS * SQRT3 * (q + r / 2);
        const py = H / 2 + HEX_RADIUS * 1.5 * r * 0.58; // 0.58 iso tilt
        
        // Height bands: H=0 (floor, 75%), H=1 (hills, 15%), H=2 (cliffs, 10%)
        let elevation = 0;
        const dist = Math.sqrt(q * q + r * r);
        if (dist > 4 && (q > 0 || r > 2)) elevation = 1;
        if (dist > 5 && q > 2) elevation = 2;

        mapHexes.push({ q, r, px, py, elevation, depthKey: (q + r) * 1000 + elevation });
      }
    }
    // Sort by isometric depth
    mapHexes.sort((a, b) => a.depthKey - b.depthKey);

    // 2. Pre-bake individual Hex Prism Sprites (simulating TerrainBlockCache)
    function bakeHexSprite(elevation) {
      const off = document.createElement('canvas');
      const size = Math.ceil(HEX_RADIUS * 2.6);
      off.width = size;
      off.height = size + 20;
      const c = off.getContext('2d');
      const cx = size / 2;
      const cy = size / 2;

      // Hex Prism extrusion
      c.save();
      c.translate(cx, cy);
      
      // Top face
      c.beginPath();
      for (let i = 0; i < 6; i++) {
        const ang = (i * Math.PI / 3) + Math.PI / 6;
        const x = Math.cos(ang) * HEX_RADIUS;
        const y = Math.sin(ang) * HEX_RADIUS * 0.58;
        if (i === 0) c.moveTo(x, y); else c.lineTo(x, y);
      }
      c.closePath();
      
      const colors = ['#2e3d30', '#3b4e3e', '#4f6953'];
      c.fillStyle = colors[elevation] || colors[0];
      c.fill();
      c.strokeStyle = '#1a241b';
      c.lineWidth = 1.5;
      c.stroke();

      // Top texture noise / detail
      c.fillStyle = 'rgba(255, 255, 255, 0.08)';
      c.beginPath();
      c.arc(0, 0, HEX_RADIUS * 0.4, 0, Math.PI * 2);
      c.fill();

      c.restore();
      return off;
    }

    const hexSprites = [bakeHexSprite(0), bakeHexSprite(1), bakeHexSprite(2)];

    // 3. Bake Bi-Layer Canvases (Height-Banded)
    // Layer 0: Ground / Floor (elevation <= 0)
    // Layer 1: Foreground / Cliffs (elevation > 0)
    const layer0Canvas = document.createElement('canvas');
    layer0Canvas.width = W;
    layer0Canvas.height = H;
    const layer0Ctx = layer0Canvas.getContext('2d');

    const layer1Canvas = document.createElement('canvas');
    layer1Canvas.width = W;
    layer1Canvas.height = H;
    const layer1Ctx = layer1Canvas.getContext('2d');

    // Bake layer 0
    mapHexes.filter(h => h.elevation === 0).forEach(h => {
      const sprite = hexSprites[h.elevation];
      layer0Ctx.drawImage(sprite, h.px - sprite.width / 2, h.py - sprite.height / 2);
    });

    // Bake layer 1
    mapHexes.filter(h => h.elevation > 0).forEach(h => {
      const sprite = hexSprites[h.elevation];
      layer1Ctx.drawImage(sprite, h.px - sprite.width / 2, h.py - sprite.height / 2);
    });

    // 4. Units (10 units, 5 vs 5)
    const units = [];
    for (let i = 0; i < 10; i++) {
      const isRed = i >= 5;
      units.push({
        x: W / 2 + (isRed ? 120 : -120) + (Math.random() - 0.5) * 160,
        y: H / 2 + ((i % 5) - 2) * 45,
        color: isRed ? '#ef4444' : '#3b82f6',
        bobPhase: Math.random() * Math.PI * 2,
      });
    }

    // 5. Render Modes & Stats
    let mode = 'PER_HEX'; // 'PER_HEX' or 'BAKED_2LAYER'
    let lastTime = performance.now();
    let frameTimes = [];
    let opStats = { drawCalls: 0, saveRestores: 0 };

    window.setMode = function(m) {
      mode = m;
      document.getElementById('btnPerHex').className = m === 'PER_HEX' ? 'active' : '';
      document.getElementById('btnBaked').className = m === 'BAKED_2LAYER' ? 'active' : '';
      document.getElementById('modeLabel').textContent = m === 'PER_HEX' ? 'Per-Hex Blit (Baseline)' : '2-Layer Height-Banded Baked';
      document.getElementById('modeLabel').style.background = m === 'PER_HEX' ? '#0284c7' : '#10b981';
      frameTimes = [];
    };

    function drawUnits(t) {
      for (const u of units) {
        const bob = Math.sin(t * 0.008 + u.bobPhase) * 3;
        ctx.save();
        opStats.saveRestores++;
        ctx.translate(u.x, u.y + bob);

        // Shadow
        ctx.fillStyle = 'rgba(0,0,0,0.3)';
        ctx.beginPath();
        ctx.ellipse(0, 10 - bob, 14, 7, 0, 0, Math.PI * 2);
        ctx.fill();

        // Unit Body
        ctx.fillStyle = u.color;
        ctx.beginPath();
        ctx.arc(0, -10, 12, 0, Math.PI * 2);
        ctx.fill();
        ctx.strokeStyle = '#ffffff';
        ctx.lineWidth = 1.5;
        ctx.stroke();

        // Core Spark
        ctx.fillStyle = '#ffffff';
        ctx.fillRect(-2, -12, 4, 4);

        ctx.restore();
      }
    }

    function renderLoop(now) {
      const dt = now - lastTime;
      lastTime = now;
      if (dt > 0 && dt < 100) frameTimes.push(dt);
      if (frameTimes.length > 60) frameTimes.shift();

      opStats.drawCalls = 0;
      opStats.saveRestores = 0;

      // Clear main canvas
      ctx.fillStyle = '#0f172a';
      ctx.fillRect(0, 0, W, H);

      if (mode === 'PER_HEX') {
        // --- MODE A: Per-Hex Blit (Current Architecture) ---
        // Each hex is independently translated & blitted with individual save/restore
        for (const h of mapHexes) {
          const sprite = hexSprites[h.elevation];
          ctx.save();
          opStats.saveRestores++;
          ctx.drawImage(sprite, h.px - sprite.width / 2, h.py - sprite.height / 2);
          opStats.drawCalls++;
          ctx.restore();
        }
        // Draw units
        drawUnits(now);
      } else {
        // --- MODE B: 2-Layer Height-Banded Baked Architecture ---
        // Layer 0: Ground / Floor (1 single drawImage blit, 0 per-hex save/restore)
        ctx.drawImage(layer0Canvas, 0, 0);
        opStats.drawCalls++;

        // Draw units (in between layers)
        drawUnits(now);

        // Layer 1: Foreground / Elevated Cliffs (1 single drawImage blit)
        ctx.drawImage(layer1Canvas, 0, 0);
        opStats.drawCalls++;
      }

      // Update HUD
      if (frameTimes.length > 10) {
        const avg = frameTimes.reduce((a, b) => a + b, 0) / frameTimes.length;
        document.getElementById('msVal').textContent = avg.toFixed(3);
        document.getElementById('fpsVal').textContent = Math.round(1000 / avg);
        document.getElementById('dcVal').textContent = opStats.drawCalls;
        document.getElementById('srVal').textContent = opStats.saveRestores;
      }

      requestAnimationFrame(renderLoop);
    }

    requestAnimationFrame(renderLoop);

    // Automated Benchmark function for e2e runner
    window.runBenchmark = async function(frameCount = 300) {
      document.getElementById('benchResult').textContent = 'Benchmarking...';
      
      const sample = (targetMode) => new Promise((resolve) => {
        setMode(targetMode);
        const durations = [];
        let count = 0;
        let last = performance.now();
        const step = (now) => {
          durations.push(now - last);
          last = now;
          count++;
          if (count < frameCount) {
            requestAnimationFrame(step);
          } else {
            const clean = durations.slice(10);
            clean.sort((a, b) => a - b);
            const med = clean[Math.floor(clean.length / 2)];
            const avg = clean.reduce((a, b) => a + b, 0) / clean.length;
            resolve({ avg, median: med, fps: 1000 / avg });
          }
        };
        requestAnimationFrame(step);
      });

      const resA = await sample('PER_HEX');
      const resB = await sample('BAKED_2LAYER');

      const deltaMs = resB.median - resA.median;
      const pct = ((deltaMs / resA.median) * 100).toFixed(2);

      const summary = {
        perHex: resA,
        baked2Layer: resB,
        deltaMs: +deltaMs.toFixed(3),
        pct: +pct,
      };

      const text = `Result: Per-Hex ${resA.median.toFixed(3)}ms (${resA.fps.toFixed(0)} FPS) -> Baked ${resB.median.toFixed(3)}ms (${resB.fps.toFixed(0)} FPS) | Delta: ${deltaMs.toFixed(3)}ms (${pct}%)`;
      document.getElementById('benchResult').textContent = text;
      window.__BENCHMARK_RESULT__ = summary;
      return summary;
    };
  </script>
</body>
</html>
